<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniInspector</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>MiniInspector</h1>
  <span id="updated" class="muted">Connecting…</span>
  <div class="actions">
    <button id="restart" type="button" class="btn">Restart</button>
    <button id="shutdown" type="button" class="btn danger">Shutdown</button>
    <button id="theme" type="button" class="btn">Theme</button>
  </div>
</header>

<section id="info" class="muted small"></section>

<section id="cards">
  <div class="card">
    <div class="label">CPU</div>
    <div class="value" id="cpu-value">—</div>
    <div class="small muted" id="cpu-name"></div>
  </div>
  <div class="card">
    <div class="label">Memory</div>
    <div class="value" id="mem-value">—</div>
    <div class="small muted" id="mem-detail"></div>
  </div>
  <div class="card">
    <div class="label">Disk I/O</div>
    <div class="value" id="disk-value">—</div>
    <div class="small muted" id="disk-detail"></div>
  </div>
  <div class="card">
    <div class="label">Network</div>
    <div class="value" id="net-value">—</div>
    <div class="small muted" id="net-detail"></div>
  </div>
  <div class="card" id="gpu-card" hidden>
    <div class="label">GPU</div>
    <div class="value" id="gpu-value">—</div>
    <div class="small muted" id="gpu-detail"></div>
  </div>
</section>

<section id="drives" class="small"></section>

<section id="charts">
  <button id="back-live" class="btn" type="button" hidden>Back to live</button>
  <div class="chart"><h2>CPU %</h2><canvas id="chart-cpu"></canvas></div>
  <div class="chart"><h2>Memory %</h2><canvas id="chart-mem"></canvas></div>
  <div class="chart"><h2>Disk I/O</h2><canvas id="chart-disk"></canvas></div>
  <div class="chart"><h2>Network</h2><canvas id="chart-net"></canvas></div>
  <div class="chart" id="gpu-chart" hidden><h2>GPU % / Temp</h2><canvas id="chart-gpu"></canvas></div>
</section>

<section id="settings">
  <h2>Settings</h2>
  <div class="fields">
    <label class="field">
      <span>Port</span>
      <input id="cfg-port" type="number" min="1" max="65535">
    </label>
    <label class="field slider">
      <span>Retention window <b id="cfg-retention-label">60 min</b></span>
      <input id="cfg-retention" type="range" min="1" max="1440" step="1" value="60">
    </label>
    <label class="field slider">
      <span>Sample interval <b id="cfg-interval-label">1 s</b></span>
      <input id="cfg-interval" type="range" min="200" max="10000" step="100" value="1000">
    </label>
  </div>
  <div class="small muted" style="margin-top:10px">Sliders apply when released · port applies on Restart</div>
</section>

<div id="toasts"></div>

<script src="app.js"></script>
</body>
</html>
